[package]
name = "mcpg-operator-api"
description = "Custom Resource Definitions and types for the MCPG Kubernetes operator"
version = "0.1.0-beta.14"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/mcpg-dev/mcpg-operator-api"
authors = ["MCPG contributors <opensource@mcpg.dev>"]


[lib]
name = "mcpg_operator_api"
path = "src/lib.rs"

# crdgen lives in the `mcpg-operator` crate (which pins a concrete
# k8s-openapi version). This crate is library-only.

[dependencies]
kube = { version = "3", default-features = false, features = ["derive"] }
# Library convention: declare k8s-openapi WITHOUT a version feature.
# The binary crate that consumes us picks the K8s version.
k8s-openapi = "0.27"
# kube 3.x consumes schemars 1.x; pin to the same range so the
# JsonSchema impl shapes line up (the derive macro reads the
# version from kube's transitive dep). `chrono` feature pulls in
# schema impls for `chrono::DateTime<Utc>` so our condition's
# `lastTransitionTime` field schema-validates as RFC3339.
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
# Tests need a concrete K8s version. Aligned with the operator
# binary's pin (v1_32) so workspace-level test runs use a single
# k8s-openapi build.
k8s-openapi = { version = "0.27", features = ["v1_32"] }
serde_json = "1"
pretty_assertions = "1"
